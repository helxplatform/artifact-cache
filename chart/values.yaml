# Default values for artifact-cache.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: containers.renci.org/helxplatform/artifact-cache
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: test-1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

ambassador:
  # register artifact-cache with ambassador (set to false to manually annotate using `service.annotations`)
  flag: true
  mapping_name: artifact-cache-mapping
  # ambassador_id to scope the Mapping to a specific Ambassador instance. Falls back to .Values.global.ambassador_id.
  ambassador_id: null

service:
  type: ClusterIP
  port: 8080
  annotations: {}

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

config:
  pvc_name: artifact-cache-pvc
  mount_path: /mnt/assets
  mount_subpath: assets
  log_level: info